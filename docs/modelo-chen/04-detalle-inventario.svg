hor="middle">tipo</text><ellipse cx="625" cy="250" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="625" y="256" class="attr" text-anchor="middle">total_gtq</text><ellipse cx="760" cy="400" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="760" y="406" class="attr" text-anchor="middle">estado</text><ellipse cx="140" cy="700" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="140" y="706" class="attr" text-anchor="middle">ocurrido_en</text><rect x="325.0" y="510.0" width="250" height="80" fill="white" stroke="#111" stroke-width="2.3"/><text x="450" y="557" class="entity" text-anchor="middle">MOVIMIENTO</text><ellipse cx="1190" cy="400" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="1190" y="406" class="attr" text-anchor="middle">numero_linea</text><line x1="1135.4" y1="412" x2="1244.6" y2="412" stroke="#111" stroke-width="1.8" stroke-dasharray="6 4"/><ellipse cx="1325" cy="250" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="1325" y="256" class="attr" text-anchor="middle">descripcion</text><ellipse cx="1675" cy="250" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="1675" y="256" class="attr" text-anchor="middle">cantidad</text><ellipse cx="1810" cy="400" rx="124.39999999999999" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="1810" y="406" class="attr" text-anchor="middle">precio_unitario_gtq</text><ellipse cx="1190" cy="700" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="1190" y="706" class="attr" text-anchor="middle">subtotal_gtq</text><rect x="1335.0" y="510.0" width="330" height="80" fill="white" stroke="#111" stroke-width="2.3"/><rect x="1342.0" y="517.0" width="316" height="66" fill="none" stroke="#111" stroke-width="2.3"/><text x="1500" y="557" class="entity" text-anchor="middle">DETALLE_MOVIMIENTO</text><ellipse cx="2240" cy="400" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="2240" y="406" class="attr" text-anchor="middle" text-decoration="underline">id_producto</text><ellipse cx="2375" cy="250" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="2375" y="256" class="attr" text-anchor="middle">sku</text><ellipse cx="2725" cy="250" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="2725" y="256" class="attr" text-anchor="middle">nombre</text><ellipse cx="2860" cy="400" rx="107.6" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="2860" y="406" class="attr" text-anchor="middle">precio_venta_gtq</text><ellipse cx="2240" cy="700" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="2240" y="706" class="attr" text-anchor="middle">controla_stock</text><ellipse cx="2375" cy="850" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="2375" y="856" class="attr" text-anchor="middle">activo</text><rect x="2425.0" y="510.0" width="250" height="80" fill="white" stroke="#111" stroke-width="2.3"/><text x="2550" y="557" class="entity" text-anchor="middle">PRODUCTO</text><ellipse cx="2240" cy="1220" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="2240" y="1226" class="attr" text-anchor="middle" text-decoration="underline">id_entrada</text><ellipse cx="2375" cy="1070" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="2375" y="1076" class="attr" text-anchor="middle">cantidad_delta</text><ellipse cx="2725" cy="1070" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="2725" y="1076" class="attr" text-anchor="middle">motivo</text><ellipse cx="2860" cy="1220" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="2860" y="1226" class="attr" text-anchor="middle">ocurrido_en</text><rect x="2385.0" y="1330.0" width="330" height="80" fill="white" stroke="#111" stroke-width="2.3"/><text x="2550" y="1377" class="entity" text-anchor="middle">ENTRADA_INVENTARIO</text><polygon points="860,550 975,483 1090,550 975,617" fill="white" stroke="#111" stroke-width="2.3"/><polygon points="872,550 975,491 1078,550 975,609" fill="none" stroke="#111" stroke-width="2.3"/><text x="975" y="556" class="relation" text-anchor="middle">CONTIENE</text><rect x="668" y="506" width="44" height="32" fill="white"/><text x="690" y="530" class="card" text-anchor="middle">1</text><rect x="1223" y="506" width="44" height="32" fill="white"/><text x="1245" y="530" class="card" text-anchor="middle">N</text><polygon points="1910,550 2025,483 2140,550 2025,617" fill="white" stroke="#111" stroke-width="2.3"/><text x="2025" y="556" class="relation" text-anchor="middle">REFERENCIA</text><rect x="1728" y="506" width="44" height="32" fill="white"/><text x="1750" y="530" class="card" text-anchor="middle">N</text><rect x="2278" y="506" width="44" height="32" fill="white"/><text x="2300" y="530" class="card" text-anchor="middle">1</text><polygon points="2435,990 2550,923 2665,990 2550,1057" fill="white" stroke="#111" stroke-width="2.3"/><text x="2550" y="996" class="relation" text-anchor="middle">TIENE</text><rect x="2563" y="881" width="44" height="32" fill="white"/><text x="2585" y="905" class="card" text-anchor="middle">1</text><rect x="2563" y="1076" width="44" height="32" fill="white"/><text x="2585" y="1100" class="card" text-anchor="middle">N</text><polygon points="1910,1370 2025,1303 2140,1370 2025,1437" fill="white" stroke="#111" stroke-width="2.3"/><text x="2025" y="1376" class="relation" text-anchor="middle">GENERA</text><rect x="1788" y="1326" width="44" height="32" fill="white"/><text x="1810" y="1350" class="card" text-anchor="middle">1</text><rect x="2248" y="1326" width="44" height="32" fill="white"/><text x="2270" y="1350" class="card" text-anchor="middle">N</text><text x="85" y="1590" class="small">DETALLE se identifica por (id_movimiento, numero_linea). numero_linea es clave parcial, no una PK global.</text><text x="85" y="1630" class="small">REFERENCIA es opcional: un gasto puede tener detalle sin producto. Toda entrada de inventario tiene un producto.</text><text x="85" y="1670" class="small">GENERA es parcial en ambos extremos: ajustes/saldos iniciales no necesitan detalle; productos sin stock no generan entradas.</text><text x="85" y="1710" class="small">El total de un movimiento puede existir sin detalle para gastos; ventas y compras requieren al menos una línea (regla por tipo).</text><text x="85" y="1750" class="small">ENTRADA_INVENTARIO es el nuevo rótulo conceptual de MOVIMIENTO_INVENTARIO; conserva un identificador global propio.</text><line x1="85" y1="1808" x2="165" y2="1808" stroke="black" stroke-width="6"/><text x="185" y="1815" class="small">Participación total</text><line x1="570" y1="1808" x2="650" y2="1808" stroke="black" stroke-width="2"/><text x="670" y="1815" class="small">Participación parcial</text><text x="1130" y="1815" class="small">1 / N / M = cardinalidad máxima · PK subrayada · clave parcial con subrayado discontinuo</text><text x="85" y="1865" class="small">Modelo conceptual ampliado. Implementación local parcial en SQLite; sin recursos cloud. Las entidades repetidas son la misma entidad.</text></svg>
