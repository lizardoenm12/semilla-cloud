<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1850" viewBox="0 0 2500 1850"><style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:36px;font-weight:700}.sub{font-size:23px}.small{font-size:20px}.entity{font-size:24px;font-weight:700}.attr{font-size:20px}.card{font-size:25px;font-weight:700}.relation{font-size:21px}</style><rect width="2500" height="1850" fill="white"/><text x="85" y="70" class="title">5. Ejemplo de la foto, corregido</text><text x="85" y="111" class="sub">Supuestos: cada pedido tiene un cliente y al menos un artículo; un artículo puede no haber sido pedido.</text><text x="85" y="148" class="small">Asistente de negocios · Lizardo Gonzalez 24000682 · Jessel Contreras 23011020 · 17/10/2026</text><polyline points="450,500 140,350" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polyline points="450,500 275,200" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polyline points="1500,500 1190,350" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polyline points="1500,500 1325,200" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polyline points="1500,1350 1190,1200" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polyline points="1500,1350 1325,1050" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polyline points="575,500 835,500" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polyline points="1065,500 1375,500" fill="none" stroke="#111" stroke-width="6" stroke-linejoin="round"/><polyline points="1500,540 1500,873" fill="none" stroke="#111" stroke-width="6" stroke-linejoin="round"/><polyline points="1500,1007 1500,1310" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polyline points="1500,940 1860,940" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/><ellipse cx="140" cy="350" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="140" y="356" class="attr" text-anchor="middle" text-decoration="underline">DNI</text><ellipse cx="275" cy="200" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="275" y="206" class="attr" text-anchor="middle">nombre</text><rect x="325.0" y="460.0" width="250" height="80" fill="white" stroke="#111" stroke-width="2.3"/><text x="450" y="507" class="entity" text-anchor="middle">CLIENTE</text><ellipse cx="1190" cy="350" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="1190" y="356" class="attr" text-anchor="middle" text-decoration="underline">id_pedido</text><ellipse cx="1325" cy="200" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="1325" y="206" class="attr" text-anchor="middle">fecha</text><rect x="1375.0" y="460.0" width="250" height="80" fill="white" stroke="#111" stroke-width="2.3"/><text x="1500" y="507" class="entity" text-anchor="middle">PEDIDO</text><ellipse cx="1190" cy="1200" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="1190" y="1206" class="attr" text-anchor="middle" text-decoration="underline">num_serie</text><ellipse cx="1325" cy="1050" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="1325" y="1056" class="attr" text-anchor="middle">descripcion</text><rect x="1375.0" y="1310.0" width="250" height="80" fill="white" stroke="#111" stroke-width="2.3"/><text x="1500" y="1357" class="entity" text-anchor="middle">ARTÍCULO</text><polygon points="835,500 950,433 1065,500 950,567" fill="white" stroke="#111" stroke-width="2.3"/><text x="950" y="506" class="relation" text-anchor="middle">REALIZA</text><rect x="678" y="456" width="44" height="32" fill="white"/><text x="700" y="480" class="card" text-anchor="middle">1</text><rect x="1178" y="456" width="44" height="32" fill="white"/><text x="1200" y="480" class="card" text-anchor="middle">N</text><polygon points="1385,940 1500,873 1615,940 1500,1007" fill="white" stroke="#111" stroke-width="2.3"/><text x="1500" y="946" class="relation" text-anchor="middle">SE COMPONE</text><rect x="1513" y="816" width="44" height="32" fill="white"/><text x="1535" y="840" class="card" text-anchor="middle">N</text><rect x="1513" y="1046" width="44" height="32" fill="white"/><text x="1535" y="1070" class="card" text-anchor="middle">M</text><ellipse cx="1860" cy="940" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="1860" y="946" class="attr" text-anchor="middle">cantidad</text><text x="85" y="1630" class="small">Fecha queda sin subrayar. Cantidad pertenece al rombo SE COMPONE. Pedido tiene clave propia, por eso no es débil.</text><line x1="85" y1="1708" x2="165" y2="1708" stroke="black" stroke-width="6"/><text x="185" y="1715" class="small">Participación total</text><line x1="570" y1="1708" x2="650" y2="1708" stroke="black" stroke-width="2"/><text x="670" y="1715" class="small">Participación parcial</text><text x="1130" y="1715" class="small">1 / N / M = cardinalidad máxima · PK subrayada · clave parcial con subrayado discontinuo</text><text x="85" y="1765" class="small">Modelo conceptual ampliado. Implementación local parcial en SQLite; sin recursos cloud. Las entidades repetidas son la misma entidad.</text></svg>
