 stroke="#111" stroke-width="2.3"/><text x="2350" y="557" class="entity" text-anchor="middle">CONTENIDO_EDUCATIVO</text><polygon points="1385,550 1500,483 1615,550 1500,617" fill="white" stroke="#111" stroke-width="2.3"/><text x="1500" y="556" class="relation" text-anchor="middle">COMPLETA</text><rect x="1078" y="506" width="44" height="32" fill="white"/><text x="1100" y="530" class="card" text-anchor="middle">M</text><rect x="1928" y="506" width="44" height="32" fill="white"/><text x="1950" y="530" class="card" text-anchor="middle">N</text><ellipse cx="1500" cy="830" rx="100" ry="33" fill="white" stroke="#111" stroke-width="2"/><text x="1500" y="836" class="attr" text-anchor="middle">completado_en</text><text x="85" y="1000" class="small">COMPLETA se materializa como progreso con clave (usuario, contenido). Una lectura no se cuenta dos veces.</text><line x1="85" y1="1108" x2="165" y2="1108" stroke="black" stroke-width="6"/><text x="185" y="1115" class="small">Participación total</text><line x1="570" y1="1108" x2="650" y2="1108" stroke="black" stroke-width="2"/><text x="670" y="1115" class="small">Participación parcial</text><text x="1130" y="1115" class="small">1 / N / M = cardinalidad máxima · PK subrayada · clave parcial con subrayado discontinuo</text><text x="85" y="1165" class="small">Modelo conceptual ampliado. Implementación local parcial en SQLite; sin recursos cloud. Las entidades repetidas son la misma entidad.</text></svg>
