111" stroke-width="2.3"/><text x="1500" y="1377" class="entity" text-anchor="middle">USUARIO</text><polygon points="860,550 975,483 1090,550 975,617" fill="white" stroke="#111" stroke-width="2.3"/><text x="975" y="556" class="relation" text-anchor="middle">REGISTRA</text><rect x="668" y="506" width="44" height="32" fill="white"/><text x="690" y="530" class="card" text-anchor="middle">1</text><rect x="1223" y="506" width="44" height="32" fill="white"/><text x="1245" y="530" class="card" text-anchor="middle">N</text><polygon points="1910,550 2025,483 2140,550 2025,617" fill="white" stroke="#111" stroke-width="2.3"/><text x="2025" y="556" class="relation" text-anchor="middle">RESPALDA</text><rect x="1728" y="506" width="44" height="32" fill="white"/><text x="1750" y="530" class="card" text-anchor="middle">1</text><rect x="2278" y="506" width="44" height="32" fill="white"/><text x="2300" y="530" class="card" text-anchor="middle">N</text><polygon points="1385,990 1500,923 1615,990 1500,1057" fill="white" stroke="#111" stroke-width="2.3"/><text x="1500" y="996" class="relation" text-anchor="middle">AUTORÍA</text><rect x="1513" y="881" width="44" height="32" fill="white"/><text x="1535" y="905" class="card" text-anchor="middle">N</text><rect x="1513" y="1076" width="44" height="32" fill="white"/><text x="1535" y="1100" class="card" text-anchor="middle">1</text><text x="85" y="1715" class="small">Cada movimiento pertenece a un negocio y tiene un autor; cada comprobante respalda exactamente un movimiento.</text><text x="85" y="1755" class="small">El autor debe tener una membresía activa y con permiso en el mismo negocio. El comprobante tiene identidad propia.</text><line x1="85" y1="1808" x2="165" y2="1808" stroke="black" stroke-width="6"/><text x="185" y="1815" class="small">Participación total</text><line x1="570" y1="1808" x2="650" y2="1808" stroke="black" stroke-width="2"/><text x="670" y="1815" class="small">Participación parcial</text><text x="1130" y="1815" class="small">1 / N / M = cardinalidad máxima · PK subrayada · clave parcial con subrayado discontinuo</text><text x="85" y="1865" class="small">Modelo conceptual ampliado. Implementación local parcial en SQLite; sin recursos cloud. Las entidades repetidas son la misma entidad.</text></svg>
