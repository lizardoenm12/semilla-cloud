vos, historial, aprendizaje y evaluaciones; no son tablas monolíticas.</text><line x1="85" y1="1108" x2="165" y2="1108" stroke="black" stroke-width="6"/><text x="185" y="1115" class="small">Participación total</text><line x1="570" y1="1108" x2="650" y2="1108" stroke="black" stroke-width="2"/><text x="670" y="1115" class="small">Participación parcial</text><text x="1130" y="1115" class="small">1 / N / M = cardinalidad máxima · PK subrayada · clave parcial con subrayado discontinuo</text><text x="85" y="1165" class="small">Modelo conceptual ampliado. Implementación local parcial en SQLite; sin recursos cloud. Las entidades repetidas son la misma entidad.</text></svg>
